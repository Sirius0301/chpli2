name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:e2e-selectors
      - run: pnpm check:i18n
      - run: pnpm typecheck
      - run: pnpm build

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chpli2_test
          POSTGRES_USER: chpli2
          POSTGRES_PASSWORD: chpli2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chpli2 -d chpli2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://chpli2:chpli2@localhost:5432/chpli2_test?schema=public
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chpli2_test
          POSTGRES_USER: chpli2
          POSTGRES_PASSWORD: chpli2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chpli2 -d chpli2_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://chpli2:chpli2@localhost:5432/chpli2_test?schema=public
      JWT_SECRET: ci-only-secret
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm test:e2e:test
